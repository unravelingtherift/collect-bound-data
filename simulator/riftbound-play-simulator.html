<!-- Riftbound Play Simulator — fan-made learning tool. Paste into a Squarespace Code Block. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@500;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>

#rbSim{--cw:60px;--bg:#0f1226;--panel:#171b38;--panel2:#1f2447;--line:rgba(232,200,120,.22);--gold:#e8c878;--gold2:#f5deaa;--text:#e9e6f5;--dim:#9aa0c8;--faint:#6f76a6;--good:#5fcf9a;--bad:#ef6a6a;--hi:#7dd3fc;
  font-family:'Spectral',Georgia,serif;color:var(--text);background:radial-gradient(1200px 600px at 20% -10%,#232a63 0,#0f1226 60%);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:1280px;margin:0 auto;position:relative;box-sizing:border-box;line-height:1.45}
#rbSim *{box-sizing:border-box}
#rbSim h1,#rbSim h2,#rbSim h3,#rbSim .rb-cin{font-family:'Cinzel',Georgia,serif;letter-spacing:.04em;color:var(--gold2);margin:0}
#rbSim button{font-family:inherit;cursor:pointer}
#rbSim [hidden]{display:none!important}
/* ---- home ---- */
#rbSim .rb-home{padding:14px 6px 6px}
#rbSim .rb-home h1{font-size:clamp(1.5rem,3.2vw,2.2rem);margin-bottom:6px}
#rbSim .rb-home p.lead{color:var(--dim);max-width:70ch;margin:0 0 18px}
#rbSim .rb-home p.rb-subhead{color:var(--gold2);font-size:1.05rem;max-width:62ch;margin:0 0 14px;font-style:italic}
#rbSim .rb-home .rb-intro{max-width:68ch;margin:0 0 16px}
#rbSim .rb-home .rb-intro p{margin:0 0 10px;line-height:1.6}
#rbSim .rb-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
#rbSim .rb-tier{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
#rbSim .rb-tier .rb-badge{font:600 .68rem 'Inter',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#1a1530;background:var(--gold);border-radius:99px;padding:3px 10px;align-self:flex-start}
#rbSim .rb-tier.mod .rb-badge{background:#8ec5ff}#rbSim .rb-tier.adv .rb-badge{background:#d9a6ff}#rbSim .rb-tier.free .rb-badge{background:#8fe3b8}
#rbSim .rb-tier h3{font-size:1.15rem}
#rbSim .rb-tier p{margin:0;color:var(--dim);font-size:.93rem}
#rbSim .rb-tier ul{margin:0;padding-left:18px;color:var(--dim);font-size:.9rem}
#rbSim .rb-lessons{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:8px}
#rbSim .rb-btn{background:linear-gradient(#f1d78f,#d9b45a);color:#2a2008;border:0;border-radius:8px;padding:9px 14px;font:700 .86rem 'Inter',system-ui,sans-serif;letter-spacing:.02em}
#rbSim .rb-btn:hover{filter:brightness(1.07)}#rbSim .rb-btn[disabled]{opacity:.45;cursor:not-allowed}
#rbSim .rb-btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
#rbSim .rb-btn.small{padding:6px 10px;font-size:.78rem}
#rbSim .rb-btn.good{background:linear-gradient(#8de6b5,#4fb987);color:#06281a}
#rbSim .rb-btn.warn{background:linear-gradient(#f4a9a9,#d86a6a);color:#2d0707}
#rbSim .rb-notice{margin-top:14px;font-size:.8rem;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}

/* ---- full-screen mode (the game fills the window; no side margins) ---- */
#rbSim.rb-full{position:fixed;inset:0;z-index:2147483000;max-width:none;width:100%;height:100vh;height:100dvh;margin:0;border:0;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden;
  --cw:min(76px,calc((100vh - 200px)/12.2),calc((100vw - 380px)/6.4));--cw:min(76px,calc((100dvh - 200px)/12.2),calc((100vw - 380px)/6.4))}
@media(max-width:900px){#rbSim.rb-full{--cw:min(66px,calc((100dvh - 210px)/12.2),calc((100vw - 56px)/5.4))}}
#rbSim .rb-game{flex:1;min-height:0;display:flex;flex-direction:column}
#rbSim .rb-top{display:flex;align-items:center;gap:10px;padding:5px 10px;background:rgba(10,12,30,.85);border-bottom:1px solid var(--line);min-height:34px;flex:0 0 auto}
#rbSim .rb-top .rb-title{font:700 .82rem 'Cinzel',serif;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
#rbSim .rb-phases{display:flex;gap:4px;align-items:center;flex:1;min-width:0;overflow:hidden}
#rbSim .rb-ph{font:600 .58rem 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
#rbSim .rb-ph.on{background:var(--gold);color:#241a05;border-color:var(--gold)}
#rbSim .rb-topbtns{display:flex;gap:6px;flex:0 0 auto}
#rbSim .rb-gbtn{display:none;position:relative}
#rbSim .rb-gbtn.dot::after{content:'';position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#ff7a59;border:1px solid #fff}
#rbSim .rb-hint{display:none;padding:4px 10px;background:#252b63;border-bottom:1px solid var(--gold);font-size:.78rem;color:var(--gold2)}
#rbSim .rb-main{flex:1;min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr) 330px;position:relative}
/* score track (left edge of the mat) */
#rbSim .rb-track{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--cw)*.12);padding:6px 0;align-items:center;background:rgba(0,0,0,.22);border-right:1px solid var(--line);height:100%}
#rbSim .rb-tk{display:flex;align-items:center;gap:2px;height:calc(var(--cw)*.5);min-height:22px}
#rbSim .rb-tkn{width:24px;height:24px;border-radius:50%;border:1.5px solid #7f89c8;color:#aab2e8;font:700 .68rem 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
#rbSim .rb-tk.win .rb-tkn{border-color:var(--gold);color:var(--gold2)}
#rbSim .rb-tkm{display:flex;flex-direction:column;gap:1px;width:0;overflow:visible;position:relative}
#rbSim .rb-tk i,#rbSim .rb-tk-l i{font:800 .6rem 'Inter',sans-serif;font-style:normal;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#06122a}
#rbSim .rb-tk i.you,#rbSim .rb-tk-l i.you{background:#7dd3fc}#rbSim .rb-tk i.cpu,#rbSim .rb-tk-l i.cpu{background:#f08a8a}
#rbSim .rb-tk .rb-tkm{position:absolute;left:0;top:0;width:100%;height:100%;flex-direction:row;align-items:center;justify-content:center;gap:0}
#rbSim .rb-tk{position:relative}
#rbSim .rb-tk .rb-tkn{position:relative;z-index:1}
#rbSim .rb-tk .rb-tkm i{position:absolute;z-index:2;box-shadow:0 0 8px currentColor}
#rbSim .rb-tk .rb-tkm i.you{left:2px;top:50%;margin-top:-8px}
#rbSim .rb-tk .rb-tkm i.cpu{right:2px;top:50%;margin-top:-8px}
#rbSim .rb-tk-l{font:600 .52rem 'Inter',sans-serif;color:var(--faint);text-align:center;line-height:1.7;margin-top:4px}
#rbSim .rb-tk-h{display:none}
/* mat */
#rbSim .rb-board{display:flex;flex-direction:column;gap:4px;padding:5px 8px 6px;min-height:0;min-width:0;overflow:hidden;
  background:radial-gradient(900px 420px at 50% 40%,rgba(48,96,190,.22),transparent 70%),linear-gradient(180deg,#0e1840,#0a1030)}
#rbSim .rb-pside{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
#rbSim .rb-mainrow{display:flex;gap:6px;align-items:stretch}
#rbSim .rb-z{position:relative;border:1px solid rgba(160,190,255,.28);border-radius:8px;background:rgba(10,20,60,.45);padding:2px 3px 3px;display:flex;flex-direction:column;gap:1px;min-width:0}
#rbSim .rb-z>em,#rbSim .rb-pile em{font:600 .5rem 'Inter',sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:#7f8fcb;line-height:1.1}
#rbSim .rb-zleg,#rbSim .rb-zch{flex:0 0 auto;align-items:center}
#rbSim .rb-zbase{flex:1 1 0}
#rbSim .rb-zbase.drop{outline:2px solid var(--hi);background:rgba(125,211,252,.12);cursor:pointer}
#rbSim .rb-bl{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;min-height:calc(var(--cw)*1.4);overflow-x:auto;overflow-y:hidden;padding:1px}
#rbSim .rb-slot{display:block;width:var(--cw);height:calc(var(--cw)*1.4);border:1px dashed rgba(160,190,255,.25);border-radius:6px}
#rbSim .rb-zp{flex:0 0 auto;flex-direction:row;gap:5px;align-items:center;padding:3px 5px}
#rbSim .rb-pile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:calc(var(--cw)*.82);height:calc(var(--cw)*1.14);border-radius:6px;border:1px solid rgba(232,200,120,.45);background:repeating-linear-gradient(45deg,#2a2f6b,#2a2f6b 5px,#1c2150 5px,#1c2150 10px)}
#rbSim .rb-pile b{font:800 calc(var(--cw)*.24) 'Inter',sans-serif;font:800 .95rem 'Inter',sans-serif;color:var(--gold2)}
#rbSim .rb-pile.trash{background:rgba(255,255,255,.04);border-style:dashed}
#rbSim .rb-pile.rdeck{width:calc(var(--cw)*.6);height:calc(var(--cw)*.6);min-height:34px;min-width:34px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle,#26307a,#141a4a)}
#rbSim .rb-pile.rdeck b{font-size:.78rem}
#rbSim .rb-runerow{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:8px;border:1px solid rgba(160,190,255,.2);background:rgba(10,20,60,.35);min-height:calc(var(--cw)*.66)}
#rbSim .rb-runerow .rb-nm2{font:700 .7rem 'Cinzel',serif;color:var(--gold2);min-width:62px}
#rbSim .rb-runes{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
#rbSim .rb-rune{width:calc(var(--cw)*.56);height:calc(var(--cw)*.56);min-width:30px;min-height:30px;border-radius:50%;border:2px solid #fff7;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;transition:.15s;box-shadow:0 0 8px rgba(255,255,255,.18)}
#rbSim .rb-rune i{font:800 .6rem 'Inter',sans-serif;font-style:normal;pointer-events:none}
#rbSim .rb-rune.mine{cursor:pointer}#rbSim .rb-rune.mine:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--hi)}
#rbSim .rb-rune.sel{box-shadow:0 0 0 3px var(--hi),0 0 14px var(--hi)}
#rbSim .rb-rune.ex{opacity:.45;transform:rotate(90deg) scale(.88);filter:grayscale(.45);box-shadow:none}
#rbSim .rb-rune.r-fury{background:#d6453d}#rbSim .rb-rune.r-calm{background:#3fae8a}#rbSim .rb-rune.r-mind{background:#4a86d8}#rbSim .rb-rune.r-body{background:#e08a2e}#rbSim .rb-rune.r-chaos{background:#9a55c8}#rbSim .rb-rune.r-order{background:#c9b43f}
#rbSim .rb-rune.hl,#rbSim .hlx.rb-rune{box-shadow:0 0 0 3px #ffd36b,0 0 16px #ffd36b}
#rbSim .rb-pool{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#rbSim .rb-chip{font:600 .68rem 'Inter',sans-serif;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
#rbSim .rb-chip b{color:var(--gold2)}
#rbSim .rb-mini{font-size:.72rem;color:var(--faint)}
#rbSim .rb-lbl{font:600 .58rem 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
/* battlefields */
#rbSim .rb-bfs{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
#rbSim .rb-bf{background:linear-gradient(180deg,rgba(40,60,140,.55),rgba(22,32,90,.6));border:1px solid rgba(160,190,255,.35);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0;min-height:0}
#rbSim .rb-bf.ctl0{border-color:#7dd3fc;box-shadow:inset 0 0 0 1px #7dd3fc66}#rbSim .rb-bf.ctl1{border-color:#f08a8a;box-shadow:inset 0 0 0 1px #f08a8a66}
#rbSim .rb-bf.drop{outline:2px solid var(--hi);cursor:pointer;background:linear-gradient(180deg,rgba(60,110,190,.55),rgba(30,50,120,.6))}
#rbSim .rb-bf.sdbf{animation:rbpulse 1.4s infinite}
@keyframes rbpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,200,120,.0)}50%{box-shadow:0 0 0 5px rgba(232,200,120,.35)}}
#rbSim .rb-bfh{display:flex;justify-content:space-between;align-items:center;gap:6px;flex:0 0 auto}
#rbSim .rb-bfn{font:700 .74rem 'Cinzel',serif;color:var(--gold2);cursor:help;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbSim .rb-bft{font-size:.64rem;color:var(--dim);line-height:1.2;max-height:2.4em;overflow:hidden;flex:0 0 auto}
#rbSim .rb-ctl{font:700 .55rem 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:99px;padding:1px 7px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
#rbSim .rb-ctl.me{background:#7dd3fc22;color:#7dd3fc;border-color:#7dd3fc}#rbSim .rb-ctl.opp{background:#f08a8a22;color:#f08a8a;border-color:#f08a8a}
#rbSim .rb-bfu{display:flex;flex-wrap:nowrap;gap:5px;align-items:center;background:rgba(0,0,0,.22);border-radius:7px;padding:3px 4px;position:relative;flex:1 1 0;min-height:calc(var(--cw)*1.4 + 8px);overflow-x:auto;overflow-y:hidden}
#rbSim .rb-bfu .rb-lbl{position:absolute;top:1px;right:5px;font-size:.5rem;opacity:.7;pointer-events:none}
/* cards */
#rbSim .rb-card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)/7);border-radius:.8em;background:#242a5c;border:.2em solid #555b96;overflow:hidden;flex:0 0 auto;cursor:pointer;transition:transform .12s,box-shadow .12s;user-select:none}
#rbSim .rb-card:hover{transform:translateY(-.3em)}
#rbSim .rb-card .rb-face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:.4em;font:600 .62em 'Inter',sans-serif;color:#fff;background:linear-gradient(160deg,#2e3571,#171b3f)}
#rbSim .rb-card .rb-nm{font:700 1em 'Cinzel',serif;text-align:center;padding:1.3em .2em 0;line-height:1.15}
#rbSim .rb-card .rb-ty{font-size:.8em;text-align:center;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#rbSim .rb-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#rbSim .rb-card .rb-cost{position:absolute;top:.2em;left:.2em;min-width:2.2em;height:2.2em;border-radius:50%;background:#101435dd;border:.15em solid var(--gold);color:var(--gold2);font:800 1.05em 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;z-index:3;padding:0 .3em}
#rbSim .rb-card .rb-pw{position:absolute;top:2.8em;left:.4em;display:flex;flex-direction:column;gap:.2em;z-index:3}
#rbSim .rb-card .rb-pw i{width:1.1em;height:1.1em;border-radius:50%;border:1px solid #fff9;display:block}
#rbSim .rb-card .rb-mt{position:absolute;bottom:.2em;right:.2em;min-width:2.4em;height:2.2em;border-radius:.6em;background:#101435e6;border:.15em solid #e8e0c0;color:#fff;font:800 1.1em 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;z-index:3;padding:0 .4em}
#rbSim .rb-card .rb-mt.up{color:#7dffb4;border-color:#7dffb4}#rbSim .rb-card .rb-mt.dn{color:#ff9a9a;border-color:#ff9a9a}
#rbSim .rb-card .rb-dmg{position:absolute;bottom:.2em;left:.2em;background:#c4323299;border:.15em solid #ff9a9a;color:#fff;font:800 1em 'Inter',sans-serif;border-radius:.6em;padding:.1em .5em;z-index:3}
#rbSim .rb-card .rb-tag{position:absolute;top:.2em;right:.2em;font:700 .75em 'Inter',sans-serif;background:#101435dd;border:1px solid var(--line);color:var(--gold2);border-radius:.4em;padding:.1em .4em;z-index:3;text-transform:uppercase;letter-spacing:.05em}
#rbSim .rb-card .rb-eq{position:absolute;left:0;right:0;bottom:2.6em;display:flex;justify-content:center;gap:2px;z-index:3}
#rbSim .rb-card .rb-eq b{font:700 .72em 'Inter',sans-serif;background:#2a7fb8dd;border:1px solid #bfe4ff;border-radius:.4em;padding:.1em .4em;color:#fff}
#rbSim .rb-card.ex{transform:rotate(9deg) scale(.96);filter:grayscale(.55) brightness(.72)}
#rbSim .rb-card.ex:hover{transform:rotate(9deg) scale(.98)}
#rbSim .rb-card.sel{box-shadow:0 0 0 3px var(--hi),0 0 16px var(--hi);transform:translateY(-.8em);z-index:6}
#rbSim .rb-card.tgt{box-shadow:0 0 0 3px #ffd36b,0 0 18px #ffd36b;animation:rbpulse 1.2s infinite}
#rbSim .rb-card.hl,#rbSim .hlx{box-shadow:0 0 0 3px #ffd36b,0 0 20px #ffd36b}
#rbSim .rb-card.nope{opacity:.6}
#rbSim .rb-card.can{box-shadow:0 0 0 2px #5fcf9a99}
#rbSim .rb-card.token{border-style:dashed}
#rbSim .rb-card.back .rb-face{background:repeating-linear-gradient(45deg,#2a2f6b,#2a2f6b 6px,#1c2150 6px,#1c2150 12px)}
#rbSim .rb-card.d-fury{border-color:#d6453d}#rbSim .rb-card.d-calm{border-color:#3fae8a}#rbSim .rb-card.d-mind{border-color:#4a86d8}#rbSim .rb-card.d-body{border-color:#e08a2e}#rbSim .rb-card.d-chaos{border-color:#9a55c8}#rbSim .rb-card.d-order{border-color:#d8c04a}#rbSim .rb-card.d-colorless{border-color:#aab0cc}
#rbSim .rb-card.d-mind.d-body{border-image:linear-gradient(135deg,#4a86d8,#e08a2e) 1}
/* hand + control bar */
#rbSim .rb-bar{background:var(--panel2);border:1px solid var(--gold);border-radius:9px;padding:4px 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex:0 0 auto;min-height:40px}
#rbSim .rb-bar .rb-msg{font-size:.8rem;flex:1 1 auto;line-height:1.3;max-height:4.2em;overflow:auto}
#rbSim .rb-bar .rb-btns{display:flex;gap:6px;flex:0 0 auto}
#rbSim .rb-bar.wait{border-color:var(--line);color:var(--dim)}
#rbSim .rb-handrow{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;justify-content:center;min-height:calc(var(--cw)*1.84 + 4px);padding-top:6px}
#rbSim .rb-hand{--hw:calc(var(--cw)*1.3);display:flex;justify-content:center;align-items:flex-end;padding:8px 8px 2px;overflow-x:auto;overflow-y:visible;min-width:0;flex:0 1 auto}
#rbSim .rb-hand .rb-card{width:var(--hw);height:calc(var(--hw)*1.4);font-size:calc(var(--hw)/7);margin-right:calc(var(--hw)*var(--ov,.08)*-1)}
#rbSim .rb-hand .rb-card:hover{z-index:7;transform:translateY(-.9em)}
#rbSim .rb-hand .rb-card.sel{z-index:8}
#rbSim .rb-flow{display:flex;flex-direction:column;gap:2px;align-items:center}
#rbSim .rb-flow .rb-card{width:calc(var(--cw)*.9);height:calc(var(--cw)*1.26);font-size:calc(var(--cw)*.9/7)}
/* side panel */
#rbSim .rb-side{display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto;min-height:0;background:rgba(10,12,30,.78);border-left:1px solid var(--line)}
#rbSim .rb-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;flex:0 0 auto}
#rbSim .rb-panel h3{font-size:.85rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#rbSim .rb-coach{border-color:var(--gold);background:linear-gradient(180deg,#252b63,#1a1f4b)}
#rbSim .rb-coach .rb-ct{font:700 .95rem 'Cinzel',serif;color:var(--gold2);margin-bottom:6px}
#rbSim .rb-coach .rb-cb{font-size:.88rem;color:var(--text)}
#rbSim .rb-coach .rb-cb p{margin:0 0 8px}#rbSim .rb-coach .rb-cb ul{margin:0 0 8px;padding-left:18px}
#rbSim .rb-coach .rb-cb b{color:var(--gold2)}
#rbSim .rb-coach .rb-cb .rb-warn{font-size:.8rem;color:#ffd7a0;background:#ffa63322;border-left:3px solid #ffa633;padding:6px 8px;border-radius:4px}
#rbSim .rb-prog{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin-bottom:8px;overflow:hidden}
#rbSim .rb-prog i{display:block;height:100%;background:var(--gold)}
#rbSim .rb-detail{font-size:.84rem}
#rbSim .rb-detail .rb-dn{font:700 .92rem 'Cinzel',serif;color:var(--gold2)}
#rbSim .rb-detail .rb-dty{color:var(--dim);font-size:.76rem;margin-bottom:4px}
#rbSim .rb-detail .rb-dtx{white-space:pre-line;color:var(--text)}
#rbSim .rb-detail img{width:60%;max-width:200px;display:block;margin:0 auto 6px;border-radius:8px}
#rbSim .rb-log{max-height:170px;overflow:auto;font-size:.76rem;color:var(--dim);display:flex;flex-direction:column;gap:2px}

}

  p: [{ hand: ['Defy', 'Ki Barrier'], bf: { 0: ['Stalwart Poro'] }, runes: { ready: 5 } }, { hand: ['Hextech Ray'], base: ['Eager Drakehound'], runes: { ready: 5 } }] };
var CH_PLAY = [
  { t: 'Watch the Computer', hl: ['bf0'], done: function (S) { return !!(S.pending && S.pending.type === 'chain' && S.pending.for === 0); }, h: '<p>This lesson uses the <b>Shen</b> deck (you) against a <b>Zed</b> deck (Computer). It is the Computer\'s turn: it will send a unit to attack the battlefield you control. Just watch for a moment…</p>' },
  { t: 'A spell is waiting on the Chain', ack: true, hl: ['chain', 'hand'], h: '<p>The Computer played <b>Hextech Ray</b> (3 damage to your Stalwart Poro). Look at the gold <b>Chain</b> strip above the bar: the spell is <b>waiting — it has not happened yet</b>.</p><p>While something is on the Chain, only <b>Reaction</b> cards can be played. Both cards in your hand are Reactions, so they glow <b>green</b>:</p><ul><li>Ki Barrier — prevent the next 7 damage to a unit this turn.</li><li>Defy — counter a spell that costs no more than 4 Energy and 1 Power.</li></ul>' },
  { t: 'Answer it with a Reaction', hl: ['card:Ki Barrier', 'card:Defy'], done: function (S) { return S.log.some(function (l) { return /^You plays (Ki Barrier|Defy)/.test(l); }); }, h: '<p>Click <b>Ki Barrier</b> (target your Stalwart Poro) or <b>Defy</b> (target Hextech Ray), then <b>drag it onto your Base</b>. Your card goes <b>on top</b> of the Chain.</p><p><span class="rb-mini">Tip: you don\'t need to exhaust runes first — Play pays for you.</span></p>' },

    runeStacks: [alt('Calm', 'Order', 12), alt('Fury', 'Chaos', 12)], scenario: scenChain, aiScript: { 6: [{ move: ['Eager Drakehound'], to: 0 }] },
    doneHtml: '<p>That is how timing works in Riftbound. When you meet a card marked <b>[Reaction]</b> at a real table, remember: it can answer something that is already waiting, and the newest answer resolves first.</p><p>Want more practice? Start a <b>Free Play</b> game with the <b>Shen</b> or <b>Zed</b> deck — the Computer will answer your spells too.</p>', steps: pre.concat(CH_PLAY) };

var chainB = chainLesson('chain-b', 'beginner', 'Reactions & the chain (timing)', 41, [

  { t: 'Action and Reaction', ack: true, h: '<p>Look at the first word of a spell\'s text:</p><ul><li>[Action] — you can play it on your turn <b>or during a showdown</b> (when units are fighting over a battlefield).</li><li>[Reaction] — everything an Action can do, <b>plus</b> you can play it <b>in response</b> to something already waiting, even on your opponent\'s turn.</li><li>No keyword — only on your own turn, when nothing else is happening.</li></ul>' },

  { t: 'Windows when you can act', ack: true, h: '<p>The game has "states" that decide what you may play:</p><ul><li>Neutral — nothing is happening. You may play anything allowed on your turn.</li><li>Showdown — a unit moved to a battlefield. Only <b>Action</b> or <b>Reaction</b> cards and abilities.</li><li>Closed — something is on the <b>Chain</b>. Only <b>Reaction</b> cards and abilities.</li></ul>' },

  { t: 'Focus in showdowns', ack: true, h: '<p>A showdown starts with <b>Focus</b> on the player who contested the battlefield. After a chain resolves in a showdown, <b>Focus passes to the next player</b>. When everyone passes Focus without playing anything, the showdown closes (and combat happens, if there is any). Let\'s see a chain inside a combat.</p>' }

  { t: 'The Chain (rules 325–331)', ack: true, h: '<p>The <b>Chain</b> is a temporary zone that exists whenever a card or ability is being played. Only one Chain exists at a time; anything played while it exists is added to it. While it exists the turn is in a <b>Closed State</b>: only cards and abilities with <b>Reaction</b> may be played or activated (rule 309.1.a).</p>' },
  { t: 'How a chain runs (rules 336–340)', ack: true, h: '<ol><li>Finalize — the oldest Pending item is fully played (choices, costs, legality check).</li><li>Execute — the player with <b>Priority</b> may play a legally timed Reaction or <b>pass</b>.</li><li>Pass — if everyone passes in sequence, go to Resolve. Otherwise Priority moves on.</li><li>Resolve — the <b>newest</b> Finalized item resolves. If items remain, players get Priority again.</li></ol>' + EX + '<p><span class="rb-mini">Simplification here: after each card is added, the other player gets one chance to answer; two passes in a row resolve the newest card.</span></p>' },
  { t: 'Exceptions', ack: true, h: '<ul><li>Units, Gear and abilities that <b>Add</b> resources resolve <b>immediately</b> when finalized (rule 337.2) — no one can respond between playing and resolving. (Gear with <b>Quick-Draw</b> can itself be played as a Reaction.)</li><li>Other players can play <b>Reactions before a spell resolves</b> (rule 359.3.c).</li><li>Triggered abilities (like Crackshot Corsair\'s attack trigger) also use the chain — the simulator resolves those immediately.</li></ul>' },
  { t: 'Focus and showdowns (rules 341–348)', ack: true, h: '<p>A showdown starts when control of a battlefield becomes contested; the player who contested it gains <b>Focus</b>. With Focus you may play an Action/Reaction card, activate an ability, or pass. When the <b>last item on a chain resolves</b> during a showdown, Focus passes to the next player in turn order — unless the chain was started by a triggered ability or an ability that Adds resources (rule 340.2.a). If all players pass Focus without doing anything, the showdown closes. Now try it:</p>' }

    { t: 'Mulligan', hl: ['hand'], done: function (S) { return S.mulliganDone[0]; }, h: '<p><b>Mulligan = a one-time do-over for your starting hand.</b></p><p><b>Why it exists:</b> your first 4 cards are random. A hand of only expensive cards would leave you doing nothing for the first turns, and a hand with no units gives you nothing to fight with. So before turn 1 you may swap up to 2 cards.</p><p><b>New to card games?</b> Keep cheap cards (cost 1–3), especially units. Swap away cards that cost a lot.</p><p><b>How:</b> click up to 2 cards, press Swap. You draw new cards first, then your old ones go to the bottom of your deck (so you can\'t redraw them). <i>Advanced: players mulligan in turn order, once, before the game begins.</i></p><p>This hand is fine — just press <b>Keep hand</b>.</p>' },
    { t: 'Start of your turn', ack: true, hl: ['runes', 'hand'], h: '<p>Every turn runs in order. Everything up to Main has already happened for you:</p><ul><li>Awaken — ready everything you control.</li><li>Beginning — score a point for each battlefield you <b>Hold</b>.</li><li>Channel — take 2 runes from the top of your Rune Deck and put them face-up on your mat. <b>Do this yourself at a real table, every single turn, right after Beginning</b> — nobody will prompt you. Here the game did it (look for the gold <b>NEW</b> tags).</li><li>Draw — draw 1 card.</li><li>Main — your turn to act (you are here).</li><li>Ending — damage heals and the turn passes.</li></ul>' },
    { t: 'Runes: Energy and Power', ack: true, hl: ['runes'], h: '<p>You just Channeled by clicking your Rune Deck — you do that at the start of every turn. Now you <b>use</b> runes like this — <b>click a rune card</b> and it turns sideways:</p><p>Each rune can make:</p><ul><li>Energy — <b>exhaust</b> (turn down) a rune: +1 Energy. This pays the <b>number</b> on a card.</li><li>Power — <b>recycle</b> a rune (send it to the bottom of your Rune Deck): +1 Power of its Domain. This pays the <b>colored symbols</b>.</li></ul><p><b>Try it now:</b> click one of your runes — it turns sideways and your Energy goes up by 1. (Not sure? You can also skip this: when you play a card the game <b>auto-pays</b> and tells you how.)</p>' },
    { t: 'Play your first unit', hl: ['card:Staunch Survivor'], done: function (S) { return has(S, 'Staunch Survivor'); }, h: '<p><b>Staunch Survivor</b> costs <b>2 Energy + 1 Body Power</b>. Click it in your hand, read its text, then <b>drag it onto your Base</b> to play it.</p><p>You have exactly enough: exhaust both runes for 2 Energy, then recycle the exhausted Body rune for the Body Power.</p><p><b>Try it by hand:</b> click a rune on your mat — <b>Exhaust</b> gives 1 Energy, <b>Recycle</b> gives 1 Power of its color. Or just press Play and the game pays for you.</p>' },
    { t: 'Units enter exhausted', ack: true, hl: ['mybase'], h: '<p>Units are played to your <b>base</b> and enter <b>exhausted</b> — they can\'t move this turn. They ready again at the start of your next turn.</p><p>Staunch Survivor has <b>Assault 2</b> (+2 Might when attacking) and <b>Shield 2</b> (+2 Might when defending).</p>' },
    { t: 'End your turn', hl: ['endturn'], done: function (S) { return S.turn >= 2; }, h: '<p>You can\'t do anything else useful. Press <b>End turn</b>.</p>' },
    { t: "The Computer's turn", done: function (S) { return S.turn >= 3 && S.active === 0 && S.phase === 'main' && !S.pending; }, hl: ['oppbase'], h: '<p>Watch the log. The second player channels <b>3 runes</b> on their first turn (an extra rune to make up for going second).</p><p>If the Computer moves onto a battlefield, a <b>showdown</b> starts and you get a chance to react. With no Action spell to play, you simply pass (this lesson does it for you).</p>' },
    { t: 'Your second turn', ack: true, hl: ['runes', 'mybase'], h: '<p>Your Survivor <b>readied</b> in Awaken, and you channeled 2 more runes (3 total).</p><p>Next: get another unit out, then use the Survivor to take a battlefield.</p>' },
    { t: 'Play Crackshot Corsair', hl: ['card:Crackshot Corsair'], done: function (S) { return has(S, 'Crackshot Corsair'); }, h: '<p><b>Crackshot Corsair</b> costs 3 Energy. Play it. (It will be exhausted this turn, but next turn it can attack.)</p>' },
    { t: 'Take a battlefield', hl: ['unit:Staunch Survivor', 'bf0', 'bf1'], done: function (S) { return !!S.showdown; }, h: '<p>Click your ready <b>Staunch Survivor</b> (it glows), then click a battlefield with no units on it. Moving <b>exhausts</b> the unit.</p><p>Nobody is there, so there is no fight — but a <b>showdown</b> still happens.</p>' },
    { t: 'Showdown and Focus', hl: ['endturn'], done: function (S) { return me0(S).points >= 1; }, h: '<p>A <b>showdown</b> is a window where players may play <b>Action</b> spells. Whoever has <b>Focus</b> acts first, then Focus passes. When both players pass in a row, it ends.</p><p>You have no spells yet, so press <b>Pass</b>.</p><p class="rb-mini">Later: cards marked <b>[Reaction]</b> can answer other spells. See the lesson <b>Reactions & the chain</b> in the menu.</p>' },
    { t: 'You Conquered!', ack: true, hl: ['points', 'bf0', 'bf1'], h: '<p>Your unit was alone at the battlefield when the showdown ended, so you <b>gained control</b> of it. Gaining control of a battlefield you have not scored this turn is a <b>Conquer</b>: <b>+1 point</b>.</p><p>You can only score each battlefield once per turn.</p>' },
    { t: 'End your turn', hl: ['endturn'], done: function (S) { return S.turn >= 4; }, h: '<p>Press <b>End turn</b>.</p>' },
    { t: "The Computer's turn", done: function (S) { return S.turn >= 5 && S.active === 0 && S.phase === 'main' && !S.pending; }, h: '<p>The Computer is playing a unit and moving one to the other battlefield…</p>' },
    { t: 'Your third turn', ack: true, hl: ['bf0', 'bf1', 'opppoints'], h: '<p>At the start of this turn you <b>held</b> the Grove of the God-Willow — you still controlled it — so you scored <b>+1 point</b> and its effect drew you a card.</p><p>Meanwhile the Computer\'s <b>Daring Poro</b> moved to the other battlefield and <b>conquered</b> it, so the Computer has a point too.</p><p>The Computer plays a different deck — <b>Shen</b> (Calm/Order). Its Daring Poro has just 2 Might, so your 3-Might Corsair can beat it.</p><p>Let\'s take that battlefield with a fight.</p>' },
    { t: 'Attack with the Corsair', hl: ['unit:Crackshot Corsair', 'bf0', 'bf1'], done: function (S) { return !!S.showdown && S.showdown.combat; }, h: '<p>Select your ready <b>Crackshot Corsair</b> (3 Might) and click the battlefield where the Computer\'s Daring Poro is.</p><p>Moving onto a battlefield where an enemy is makes you the <b>attacker</b>. That starts a <b>combat showdown</b>.</p>' },
    { t: 'Combat!', done: function (S, evs) { return evt(evs, 'combat-damage'); }, h: '<p>Combat has <b>three steps</b>:</p><ul><li>Showdown — triggered abilities happen first. Corsair says <i>“When I attack, deal 1 to an enemy unit here”</i> — choose the Daring Poro.</li><li>Damage — each side adds up its <b>Might</b> and assigns that much damage to the other side\'s units.</li><li>Result — dead units go to the trash.</li></ul><p>Choose the Daring Poro, then <b>Pass</b> when asked.</p>' },
    { t: 'Combat result', ack: true, hl: ['points', 'bf0', 'bf1'], h: '<p>Corsair (3 Might) beat Daring Poro (2 Might, 1 damage already). The Poro dealt 2 — Corsair has 3 Might so it survived, and damage <b>heals at the end of combat</b>.</p><p>You were the only player left there, so you gained control and <b>Conquered</b> (+1 point). The loser of a combat loses its units there; if both sides survive, the attackers are sent back to base.</p>' },
    { t: 'End your turn', hl: ['endturn'], done: function (S) { return S.turn >= 6; }, h: '<p>Play another unit first if you like (more units mean more Might), then press <b>End turn</b>.</p>' },
    { t: "The Computer's turn", done: function (S) { return S.turn >= 7 && S.active === 0 && S.phase === 'main' && !S.pending; }, h: '<p>The Computer builds its board…</p>' },
    { t: 'Hold!', ack: true, hl: ['points', 'bf0', 'bf1'], h: '<p>At the start of this turn (the <b>Beginning</b> phase) you <b>held</b> every battlefield you still controlled — that is <b>+1 point per battlefield</b>, and each battlefield has its own effect when held. Check the log.</p><p>That is the whole core loop: <b>build a board, take battlefields, score each turn, hold them</b>.</p>' },
    { t: 'You are ready', ack: true, btn: 'Finish lesson', h: '<p>Keep playing — the Computer plays normally from here. First to 8 points wins.</p><p>The <b>final point</b> has a special rule, which the Advanced tier explains.</p>' }
  ]
};
function me0(S) { return S.players[0]; }

  if (key.indexOf('card:') === 0) return '.rb-hand [data-cname="' + key.slice(5) + '"]';
  if (key.indexOf('unit:') === 0) return '.rb-bf [data-cname="' + key.slice(5) + '"],.rb-zbase [data-cname="' + key.slice(5) + '"]';
  return '[data-hl~="' + key + '"]';
}
function applyHl() {
  $$('.hlx').forEach(function (e) { e.classList.remove('hlx'); });
  if (!coach || !coach.steps[coach.i]) return;
  (coach.steps[coach.i].hl || []).forEach(function (k) { $$(hlSelectors(k)).forEach(function (e) { e.classList.add('hlx'); }); });
}

// ---------- coach logic ----------
function coachUpdate() {
  if (!coach) return;
  var guard = 0;
  while (coach.steps[coach.i] && guard++ < 8) {
    var st = coach.steps[coach.i];
    if (st.ack) break; // waits for the Continue button
    var evs = S.events.slice(coach.start);
    if (st.done && st.done(S, evs)) { coach.i++; coach.start = S.events.length; if (coach.steps[coach.i] && coach.steps[coach.i].onStart) coach.steps[coach.i].onStart(S); continue; }
    break;
  }
  renderSide(); applyHl();
}

// ---------- modals ----------
function closeModal() { var m = $('.rb-modal'); if (m) m.remove(); }

  if (P.type === 'option') { h += '<div class="rb-opts">' + P.options.map(function (o) { return barBtn(esc(o), 'opt:' + o, ''); }).join('') + '</div>'; }
  else if (P.type === 'yesno') { h += '<div class="rb-opts">' + barBtn('Yes', 'yes', 'good') + barBtn('No', 'no', 'ghost') + '</div>'; }

    h += '<div class="rb-multi">' + P.options.map(function (uid) { var c = RB.byUid(S, uid); return tile(c, { zone: c.loc === 'runes' ? 'base' : 'base', act: 'mchoice', cls: ui.multi.indexOf(uid) >= 0 ? 'sel' : '', noimg: false }); }).join('') + '</div>' +
      '<div class="rb-mini">Choose up to ' + P.max + '. ' + ui.multi.length + ' chosen.</div><div class="rb-opts">' + barBtn('Confirm', 'mconfirm', 'good') + '</div>';

}
function showEnd() {

  var won = S.winner === 0;

    barBtn('Play again', 'restart', 'good') + barBtn('Back to menu', 'menu', 'ghost') + '</div></div></div>');
}

root.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('rb-legendp')) ui.legendOpen = e.target.open; }, true);
function fitHand() {
  var hand = $('.rb-hand'); if (!hand) return; var cards = $$('.rb-card', hand); var n = cards.length; if (n < 2) return;
  var w = cards[0].getBoundingClientRect().width, avail = hand.parentNode.clientWidth - 24, flow = $('.rb-flow'); if (flow) avail -= flow.getBoundingClientRect().width + 8;
  var ov = (n * w - avail) / ((n - 1) * w); ov = Math.max(0.05, Math.min(0.78, ov)); hand.style.setProperty('--ov', ov);

// ---------- events ----------
var dragUid = null;

  dragUid = +el.getAttribute('data-uid'); ui.detail = dragUid; try { e.dataTransfer.setData('text/plain', String(dragUid)); e.dataTransfer.effectAllowed = 'move'; } catch (x) {}
  var cc = RB.byUid(S, dragUid), b = dragBase();

});
root.addEventListener('dragover', function (e) { if (dragUid != null && e.target.closest && e.target.closest('.rb-zbase[data-act="base"]')) { e.preventDefault(); } });

root.addEventListener('click', function (e) {
  
  var el = e.target.closest('[data-act]'); if (!el || !root.contains(el)) return;

  if (a === 'guide') { var sd = $('.rb-side'); sd.classList.toggle('open'); var g = $('.rb-gbtn'); if (g) g.classList.remove('dot'); return; }
  if (!S && a !== 'start' && a !== 'startlesson') return;
  if (false && ui.runePop != null) { ui.runePop = null; placePop(); var rr = $$('.rb-rune.sel'); rr.forEach(function (x) { x.classList.remove('sel'); }); }

  if (a === 'runeexh' || a === 'runerec') { var ru2 = +el.getAttribute('data-uid'); var rs = a === 'runeexh' ? RB.exhaustRune(S, 0, ru2) : RB.recycleRune(S, 0, ru2); if (rs && rs.ok === false) { deny(el, rs.why); return; } render(); coachUpdate(); return; }
  if (a === 'restart') { closeModal(); startGame(lesson); return; }
  if (a === 'restartbtn') { closeModal(); startGame(lesson); return; }
  if (a === 'coachnext') { coach.i++; coach.start = S.events.length; var ns = coach.steps[coach.i]; if (ns && ns.onStart) ns.onStart(S); coachUpdate(); return; }
  if (a === 'coachclose') { coach = null; renderSide(); applyHl(); return; }
  if (S.winner != null) return;
  var P = S.pending;
  if (a === 'mull') { act(RB.mulligan(S, 0, ui.mull.map(Number)) || { ok: true }); ui.mull = []; return; }
  if (a === 'chanpile' || a === 'drawpile') { if (!S.startTodo) { deny(el, a === 'chanpile' ? 'you Channel from your Rune Deck only at the start of your turn.' : 'you draw for the turn only at the start of your turn.'); return; } act(a === 'chanpile' ? RB.channelRune(S, 0) : RB.drawStart(S, 0)); return; }
  if (a === 'endturn') { var okE = RB.endTurn(S); act(okE ? { ok: true } : { ok: false, why: 'you can only end your turn during your own Main phase, when no choice or showdown is waiting on screen.' }); return; }
  if (a === 'pass') { act(RB.pass(S, 0)); return; }
  if (a === 'cancel') { act(RB.resolvePending(S, 0, '__cancel')); return; }
  if (a === 'clearsel') { ui.sel = null; ui.selUnits = []; render(); return; }
  if (a === 'play') { if (ui.sel != null) { var uid = ui.sel; ui.sel = null; act(RB.playCard(S, 0, uid)); } return; }
  if (a.indexOf('ability:') === 0) { var p = a.split(':'); act(RB.useAbility(S, 0, +p[1], +p[2])); return; }
  if (a.indexOf('opt:') === 0) { act(RB.resolvePending(S, 0, a.slice(4))); return; }
  if (a === 'yes') { act(RB.resolvePending(S, 0, true)); return; }
  if (a === 'no') { act(RB.resolvePending(S, 0, false)); return; }
  if (a === 'mchoice') { var id = +el.getAttribute('data-uid'), i = ui.multi.indexOf(id); if (i >= 0) ui.multi.splice(i, 1); else if (ui.multi.length < S.pending.max) ui.multi.push(id); closeModal(); openChoiceModal(S.pending); return; }
  if (a === 'mconfirm') { var ch = ui.multi || []; ui.multi = []; act(RB.resolvePending(S, 0, ch)); return; }
  var uidc = +el.getAttribute('data-uid');
  // targeting
  if (P && P.for === 0 && P.type === 'target') {
    if (a === 'bf' && P.options.indexOf('bf' + el.getAttribute('data-bf')) >= 0) { act(RB.resolvePending(S, 0, 'bf' + el.getAttribute('data-bf'))); return; }

    return;
  }

    ui.detail = uidc; ui.selUnits = []; ui.sel = (ui.sel === uidc ? null : uidc); render();

    }

function findLesson(id) { var all = []; Object.keys(LESSONS).forEach(function (k) { (LESSONS[k] || []).forEach(function (l) { all.push(l); }); }); for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i]; return null; }

// ---------- home ----------
function homeHtml() {
  var tiers = [
    { k: 'beginner', cls: 'beg', badge: 'Tier 1 · Beginner', h: 'Your first game', p: 'A guided game from turn 1 against a scripted opponent. No spells or gear — just the core loop.', ul: ['Card types, decks and game setup', 'Runes, Energy and Power', 'Playing and moving units', 'Showdowns, combat and Might', 'Conquer, Hold and winning', 'Reactions and the chain (timing)'] },
    { k: 'moderate', cls: 'mod', badge: 'Tier 2 · Moderate', h: 'Spells, gear and tokens', p: 'Short lessons that start from a prepared board, one idea at a time.', ul: ['Action spells and Focus', 'Equipment and attaching', 'Tokens and colorless cards', 'Your Legend: Empower', 'Reactions and the chain (timing)'] },
    { k: 'advanced', cls: 'adv', badge: 'Tier 3 · Advanced', h: 'Radiance & close games', p: 'The newest mechanics and the rules that decide tight games.', ul: ['Disarm (new in Radiance)', 'The Final Point rule', 'Reactions and the chain — full rules', 'Neeko and colorless Champions (preview)'] }
  ];
  var h = '<div class="rb-home">' + (HANDBOOK ? '<p class="rb-mini" style="margin:0 0 6px"><a href="' + esc(HANDBOOK) + '" style="color:inherit;font-weight:700">← Back to the Starter Handbook</a></p>' : '') + '<h1>Learn the Basics at Your Own Pace</h1><p class="rb-subhead">A stress-free, interactive space built for absolute beginners. No timers, no pressure, and no experience required.</p><div class="rb-intro"><p>Getting into a new trading card game can feel a little intimidating, especially if you’re worried about making mistakes or feeling left behind at local events. That is exactly why this simulator exists.</p><p>Think of this as a relaxed practice playground where you can figure out the mechanics on your own terms. There is absolutely no competitive pressure here, and no one is judging you for not knowing the rules yet. It is just a straightforward, interactive way to see how turns flow, figure out how the cards work together, and build your confidence before you ever step foot in a card shop.</p><p>Whether you’ve never touched a tabletop card game before or you just want a quiet spot to test the waters, you can jump right in and learn as you go.</p></div><p class="lead">Pick a tier (each one adds a few more rules) or skip straight to a free game against the Computer. Lessons use the <b>Jayce</b> deck (Mind/Body); in Free Play you can also pick <b>Zed</b> (Fury/Chaos), <b>Shen</b> (Calm/Order), <b>Viktor</b> (Mind/Order, Recruit tokens) or <b>Lillia</b> (Calm/Mind, Sprite tokens).</p><div class="rb-tiers">';
  tiers.forEach(function (t) {
    h += '<div class="rb-tier ' + t.cls.replace('beg', '') + '"><span class="rb-badge">' + t.badge + '</span><h3>' + t.h + '</h3><p>' + t.p + '</p><ul>' + t.ul.map(function (u) { return '<li>' + u + '</li>'; }).join('') + '</ul><div class="rb-lessons">';
    (LESSONS[t.k] || []).forEach(function (l) { h += '<button type="button" class="rb-btn ' + (t.k === 'beginner' && l.id === 'beg-1' ? '' : (t.k === 'beginner' ? '' : 'ghost')) + '" data-act="startlesson" data-lesson="' + l.id + '">' + esc(l.menu || l.title) + '</button>'; });
    h += '</div></div>';
  });
  h += '<div class="rb-tier free"><span class="rb-badge">Free Play</span><h3>Play the Computer</h3><p>A normal 1v1 game. Pick one of five decks; the Computer picks a deck at random and plays a simple, legal strategy. You can answer its spells with Reactions, and it can answer yours.</p><ul><li>Random first player</li><li>Full rules as implemented here</li></ul><div class="rb-lessons"><button type="button" class="rb-btn" data-act="start">Start a game</button></div></div>';
  h += '</div><div class="rb-notice">' + (HANDBOOK ? '<a href="' + esc(HANDBOOK) + '" style="color:inherit;font-weight:700">Read the Starter Handbook</a> for the full beginner guide. ' : '') + 'Fan-made learning tool. Not affiliated with or endorsed by Riot Games. Card names and artwork belong to Riot Games. Rules follow the Riftbound Core Rules updated October 9, 2026, with these tutorial simplifications: the Chain is simplified (each player gets one chance to answer, then the newest card resolves), combat damage is assigned automatically, Hidden and Repeat are not in yet, and only the cards in the Jayce, Zed, Shen, Viktor and Lillia decks are implemented. More decks are on the way.</div></div>';
  return h;
}
