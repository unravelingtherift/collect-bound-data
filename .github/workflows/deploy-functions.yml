name: Deploy Supabase functions
# Runs when a merged PR changes a function in supabase/functions/.
# Needs the SUPABASE_ACCESS_TOKEN repository secret (Supabase → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the access token is set
        id: tok
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == 'yes'
        with:
          version: latest
      - name: Deploy
        if: steps.tok.outputs.ok == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # A merged change deploys only the functions it touched (so unrelated live functions are left alone).
          # Running it by hand (workflow_dispatch) deploys every function in the folder.
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            names=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions | cut -d/ -f3 | sort -u)
          else
            names=$(ls supabase/functions)
          fi
          for name in $names; do
            [ -d "supabase/functions/$name" ] || continue
            supabase functions deploy "$name" --project-ref jnxgkasdbzobwzyxiumg --no-verify-jwt --yes
            echo "- Deployed **$name**" >> "$GITHUB_STEP_SUMMARY"
          done
